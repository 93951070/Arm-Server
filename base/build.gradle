plugins {
    id 'java-library'
}

group 'armardillo_server'
version '1.0-SNAPSHOT'

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.12'
    api project(":dexlib2")
    api project(":dex2c")
    api project(":arsc")
    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    api group: 'org.slf4j', name: 'slf4j-api', version: '2.0.13'
    // fastjson2 核心库 (新版包名 com.alibaba.fastjson2)
    api group: 'com.alibaba.fastjson2', name: 'fastjson2', version: '2.0.52'
    // fastjson v1 兼容模块 (旧包名 com.alibaba.fastjson, 内部使用 fastjson2 实现)
    api group: 'com.alibaba', name: 'fastjson', version: '2.0.52'
    // https://mvnrepository.com/artifact/org.mybatis/mybatis
    api group: 'org.mybatis', name: 'mybatis', version: '3.5.16'
    // https://mvnrepository.com/artifact/mysql/mysql-connector-java
    api group: 'mysql', name: 'mysql-connector-java', version: '8.0.33'
    // https://mvnrepository.com/artifact/com.qiniu/qiniu-java-sdk
    api group: 'com.qiniu', name: 'qiniu-java-sdk', version: '7.19.0'
    // https://mvnrepository.com/artifact/redis.clients/jedis
    api group: 'redis.clients', name: 'jedis', version: '4.4.8'
    // https://mvnrepository.com/artifact/kxml2/kxml2
    api group: 'kxml2', name: 'kxml2', version: '2.3.0'
    // https://mvnrepository.com/artifact/xmlpull/xmlpull
    api group: 'xmlpull', name: 'xmlpull', version: '1.1.3.1'
    // https://mvnrepository.com/artifact/org.redisson/redisson
    api group: 'org.redisson', name: 'redisson', version: '3.27.2'
    // https://mvnrepository.com/artifact/com.google.code.gson/gson
    api group: 'com.google.code.gson', name: 'gson', version: '2.11.0'
    // https://mvnrepository.com/artifact/com.squareup.okhttp3/okhttp
    api group: 'com.squareup.okhttp3', name: 'okhttp', version: '4.12.0'

}
