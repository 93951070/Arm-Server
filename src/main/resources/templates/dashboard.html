<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Armadillo 管理后台 - 仪表盘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }

        /* 顶部栏 - 手机端 */
        .topbar { display: none; position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #2c3e50; z-index: 1001; align-items: center; padding: 0 16px; }
        .topbar .hamburger { width: 32px; height: 32px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
        .topbar .hamburger span { display: block; width: 24px; height: 3px; background: #fff; border-radius: 2px; transition: 0.3s; }
        .topbar .hamburger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .topbar .hamburger.open span:nth-child(2) { opacity: 0; }
        .topbar .hamburger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        .topbar .topbar-title { color: #fff; font-size: 18px; font-weight: 600; margin-left: 16px; }

        /* 侧边栏 */
        .sidebar { position: fixed; left: 0; top: 0; width: 220px; height: 100vh; background: #2c3e50; padding-top: 20px; z-index: 1000; transition: transform 0.3s ease; }
        .sidebar .logo { color: #fff; text-align: center; font-size: 20px; font-weight: 700; padding: 15px 0; border-bottom: 1px solid #34495e; }
        .sidebar a { display: block; color: #bdc3c7; text-decoration: none; padding: 14px 24px; font-size: 14px; transition: all 0.3s; }
        .sidebar a:hover { background: #34495e; color: #fff; }
        .sidebar a.active { background: #3498db; color: #fff; }

        /* 遮罩层 */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }

        /* 主内容 */
        .main-content { margin-left: 220px; padding: 30px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 10px; }
        .page-header h1 { color: #2c3e50; font-size: 28px; }
        .alert-error { background: #fee; color: #c33; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #fcc; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
        .stat-card .stat-value { font-size: 36px; font-weight: 700; color: #2c3e50; margin-bottom: 8px; }
        .stat-card .stat-label { color: #7f8c8d; font-size: 14px; }
        .stat-card.blue .stat-value { color: #3498db; }
        .stat-card.green .stat-value { color: #27ae60; }
        .stat-card.orange .stat-value { color: #e67e22; }
        .stat-card.red .stat-value { color: #e74c3c; }
        .stat-card.purple .stat-value { color: #9b59b6; }
        .info-card { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .info-card h2 { color: #2c3e50; font-size: 18px; margin-bottom: 15px; }
        .info-card p { color: #555; font-size: 14px; margin-bottom: 8px; }
        .btn { display: inline-block; padding: 8px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; text-decoration: none; transition: opacity 0.3s; }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-primary:hover { opacity: 0.9; }

        /* 手机端响应式 */
        @media (max-width: 768px) {
            .topbar { display: flex; }
            .sidebar { transform: translateX(-100%); padding-top: 76px; }
            .sidebar.open { transform: translateX(0); }
            .sidebar .logo { display: none; }
            .main-content { margin-left: 0; padding: 76px 16px 20px; }
            .page-header h1 { font-size: 22px; }
            .stats-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            .stat-card { padding: 16px 12px; }
            .stat-card .stat-value { font-size: 26px; }
            .stat-card .stat-label { font-size: 12px; }
            .info-card { padding: 16px; }
        }
        @media (max-width: 380px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="hamburger" onclick="toggleSidebar()">
            <span></span><span></span><span></span>
        </div>
        <span class="topbar-title">Armadillo</span>
    </div>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="logo">Armadillo</div>
        <a th:href="@{/dashboard}" class="active">仪表盘</a>
        <a th:href="@{/users}">用户管理</a>
        <a th:href="@{/cards}">卡密管理</a>
        <a th:href="@{/notices}">公告管理</a>
        <a th:href="@{/versions}">版本管理</a>
        <a th:href="@{/logout}" style="position:absolute; bottom:20px; width:100%;">退出登录</a>
    </div>
    <div class="main-content">
        <div class="page-header">
            <h1>仪表盘</h1>
            <form method="post" action="/admin/cache/refresh" style="display:inline;">
                <button type="submit" class="btn btn-primary">刷新缓存</button>
            </form>
        </div>
        <div class="alert-error" th:if="${dbError}" th:text="${dbError}"></div>
        <div class="stats-grid">
            <div class="stat-card blue">
                <div class="stat-value" th:text="${totalUsers}">0</div>
                <div class="stat-label">总用户数</div>
            </div>
            <div class="stat-card green">
                <div class="stat-value" th:text="${activeUsers}">0</div>
                <div class="stat-label">有效用户</div>
            </div>
            <div class="stat-card red">
                <div class="stat-value" th:text="${expiredUsers}">0</div>
                <div class="stat-label">已过期用户</div>
            </div>
            <div class="stat-card orange">
                <div class="stat-value" th:text="${todayNewUsers}">0</div>
                <div class="stat-label">今日新增</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-value" th:text="${totalCards}">0</div>
                <div class="stat-label">总卡密数</div>
            </div>
            <div class="stat-card green">
                <div class="stat-value" th:text="${unusedCards}">0</div>
                <div class="stat-label">未使用卡密</div>
            </div>
            <div class="stat-card blue">
                <div class="stat-value" th:text="${noticeCount}">0</div>
                <div class="stat-label">公告数量</div>
            </div>
        </div>
        <div class="info-card">
            <h2>服务器信息</h2>
            <p>服务器时间：<span th:text="${serverTime}">--</span></p>
            <p>应用名称：Armadillo 管理后台</p>
            <p>版本号：1.3.2</p>
        </div>
    </div>
    <script>
        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('overlay');
            var hamburger = document.querySelector('.hamburger');
            sidebar.classList.toggle('open');
            hamburger.classList.toggle('open');
            overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
        }
    </script>
</body>
</html>
